name: CI

on:
  push:
  pull_request:

jobs:
  test-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: node tools/build.mjs
      - name: Drive a scoring session in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/flow.mjs
      - name: Screenshots at 1440, 390 and 360 px (fails on console errors, 4xx or a scrolling live screen)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/screenshots.mjs _site 4391
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
